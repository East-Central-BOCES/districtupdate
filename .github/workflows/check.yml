name: Verify and package Moodle plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ldap, mbstring
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 verification/verify.py
      - run: python3 verification/package.py local_districtupdate-0.1.10.zip
      - uses: actions/upload-artifact@v4
        with:
          name: local_districtupdate-php-${{ matrix.php }}
          path: local_districtupdate-0.1.10.zip
